name: Calendar Reliability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: app
      - run: npm run demo:calendar
        working-directory: app
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: harness
      - run: npm test
        working-directory: harness
      - run: npm run demo
        working-directory: harness
      - run: npm run lab -- demo --out .lab-runs/ci
        working-directory: harness
      - run: npm run lab -- report --run .lab-runs/ci --out .lab-runs/ci/report.html
        working-directory: harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-lab-reports
          path: |
            harness/.lab-runs/ci/**/*.json
            harness/.lab-runs/ci/report.html
          include-hidden-files: true
          if-no-files-found: ignore
